services:
  - type: web
    name: aromas-by-pikin
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:cloud
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: SERVE_FRONTEND
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://isfyxzgvysmjjcgxniei.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_oaBMY-kucI9WA-sN9ACVeQ_Mug85A6e
